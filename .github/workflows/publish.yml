name: Publish Quarto Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build Mathematical Logic (L2) course PDF
        id: logic_pdf
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: livre.tex
          working_directory: courses/logique-l2

      - name: Add course PDF to the site files
        if: steps.logic_pdf.outcome == 'success'
        run: |
          mkdir -p files
          cp courses/logique-l2/livre.pdf files/logique-mathematique-L2.pdf

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
